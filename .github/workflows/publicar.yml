# Descarrega os dados, corre os testes, constrói a app e publica-a no GitHub Pages.
# Corre:
#   - todas as noites (02:15 UTC = 02:15 em Lisboa no inverno, 03:15 no verão);
#   - quando há alterações na app ou no pipeline (atualização curta, só para publicar);
#   - a pedido, no botão "Run workflow" (separador Actions do GitHub).
name: Publicar app

on:
  schedule:
    - cron: "15 2 * * *"
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:
    inputs:
      minutos:
        description: "Tempo máximo a descarregar dados (minutos)"
        default: "180"

permissions:
  contents: read
  actions: write # para apagar cópias antigas da cache (ver passo "Arrumar a cache")
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # versão do modelo de tradução: mudar o "-v1" obriga a prepará-lo outra vez
  CHAVE_MODELO: modelo-opus-mt-tc-big-en-pt-ct2-int8-v1

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # A cópia local dos dados (preços, triagem, traduções…) NÃO vai para o Git: fica na cache
      # do GitHub Actions, que não tem histórico (só se guardam as 3 cópias mais recentes).
      - name: Recuperar a cópia local dos dados (cache)
        id: dados
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache
            data
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      # Se a cache se perdeu (o GitHub apaga caches sem uso há 7 dias), vai buscar ao site
      # publicado o radar, as páginas das ações, as traduções e o estado da triagem.
      - name: Sem cache — recuperar dados do site publicado
        if: steps.dados.outputs.cache-matched-key == ''
        working-directory: pipeline
        run: |
          pip install -q requests
          python -m ferramentas.recuperar_publicado "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" || echo "Nada publicado ainda: começa do zero"

      - name: Recuperar o modelo de tradução (cache)
        id: modelo
        uses: actions/cache/restore@v4
        with:
          path: pipeline/modelos
          key: ${{ env.CHAVE_MODELO }}

      - name: Preparar o modelo de tradução (só na primeira vez)
        if: steps.modelo.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: |
          python -m venv /tmp/conversor
          /tmp/conversor/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/conversor/bin/pip install -q -r requirements-modelo.txt
          /tmp/conversor/bin/python -m ferramentas.preparar_modelo

      - name: Guardar o modelo de tradução (cache)
        if: steps.modelo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pipeline/modelos
          key: ${{ env.CHAVE_MODELO }}

      - name: Instalar o pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Testes do pipeline
        working-directory: pipeline
        run: python -m pytest -q

      - name: Descarregar dados e calcular
        working-directory: pipeline
        env:
          # universo: lista manual + lista oficial da XTB (PDF público, renovado 1×/semana)
          RADAR_LISTA_XTB: sim
          # à noite e a pedido: até 3 h; depois de uma alteração ao código: só 20 min
          RADAR_MINUTOS_DADOS: ${{ github.event_name == 'push' && '20' || inputs.minutos || '180' }}
          # tradução das descrições: modelo aberto OPUS-MT, aqui mesmo (sem contas nem chaves)
          RADAR_TRADUTOR: opus
          RADAR_TRADUCAO_MINUTOS: ${{ github.event_name == 'push' && '5' || '25' }}
          # Alternativa desligada — Microsoft Azure (precisa de conta e dos segredos):
          # RADAR_TRADUTOR: azure
          # AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          # AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          # RADAR_TRADUCAO_LIMITE_MES: "1500000"
        run: python -m radar.gerar

      - name: Guardar a cópia local dos dados (cache), mesmo que algo tenha falhado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache
            data
          key: dados-${{ github.run_id }}

      - name: Arrumar a cache (fica só com as 3 cópias de dados mais recentes)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key dados- --sort created_at --order desc --limit 100             --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar, testar e construir a app
        working-directory: app
        run: |
          npm ci
          npm run dados
          npm test
          npm run build

      # abre a app construída num browser a sério (Chrome do GitHub) e falha se alguma página
      # não abrir, tiver erros na consola ou a tabela do Radar precisar de scroll para o lado
      - name: Verificar a app num browser
        working-directory: app
        run: npm run verificar

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

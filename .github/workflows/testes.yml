# Corre os testes automáticos dos cálculos sempre que há alterações no pipeline.
name: Testes do pipeline

on:
  push:
    paths: ["pipeline/**", ".github/workflows/testes.yml"]
  pull_request:
    paths: ["pipeline/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
